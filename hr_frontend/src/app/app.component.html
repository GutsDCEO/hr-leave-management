<!-- app.component.html -->
<div class="app-vertical-layout">
    <app-navbar *ngIf="authService.isLoggedIn"></app-navbar>
    <div class="app-layout">
      <app-employee-sidebar *ngIf="authService.isLoggedIn && authService.currentRole === 'EMPLOYEE'"></app-employee-sidebar>
      <app-sidebar *ngIf="authService.isLoggedIn && authService.currentRole !== 'EMPLOYEE'"></app-sidebar>
      <div class="main-content">
        <div id="content">
            <nav class="navbar navbar-default">
              <div class="container-fluid">
                <ul class="nav navbar-nav navbar-right">
                  <li>
                    <a href="#"><i class="zmdi zmdi-notifications text-danger"></i>
                    </a>
                  </li>
                </ul>
              </div>
            </nav>
        </div>
        <router-outlet></router-outlet>
      </div>
    </div>
    <footer class="app-footer">
      <div class="footer-content">
        <div class="footer-section">
          <p class="copyright">&copy; 2025 HR Platform. All rights reserved.</p>
        </div>
        <div class="footer-section">
          <div class="footer-links">
            <a href="#" class="footer-link">Privacy Policy</a>
            <a href="#" class="footer-link">Terms of Service</a>
            <a href="#" class="footer-link">Support</a>
          </div>
        </div>
      </div>
    </footer>
</div>
