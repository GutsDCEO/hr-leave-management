<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Create Account</h2>
      <p>Join our HR management platform</p>
    </div>
    
    <div class="auth-body">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input 
            type="email" 
            id="email"
            class="form-control" 
            formControlName="email" 
            placeholder="Enter your email"
            [class.error]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          <div class="form-error" *ngIf="registerForm.get('email')?.hasError('required') && registerForm.get('email')?.touched">
            Email is required
          </div>
          <div class="form-error" *ngIf="registerForm.get('email')?.hasError('email') && registerForm.get('email')?.touched">
            Please enter a valid email address
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password"
            class="form-control" 
            formControlName="password" 
            placeholder="Create a strong password"
            [class.error]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          <div class="form-error" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
            {{ getPasswordErrorMessage() }}
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="firstName">First Name</label>
          <input 
            type="text" 
            id="firstName"
            class="form-control" 
            formControlName="firstName" 
            placeholder="Enter your first name"
            [class.error]="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched">
          <div class="form-error" *ngIf="registerForm.get('firstName')?.hasError('required') && registerForm.get('firstName')?.touched">
            First name is required
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="lastName">Last Name</label>
          <input 
            type="text" 
            id="lastName"
            class="form-control" 
            formControlName="lastName" 
            placeholder="Enter your last name"
            [class.error]="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched">
          <div class="form-error" *ngIf="registerForm.get('lastName')?.hasError('required') && registerForm.get('lastName')?.touched">
            Last name is required
          </div>
        </div>

        <button 
          type="button" 
          class="btn-admin" 
          [class.active]="showAdminCode"
          (click)="onAdminClick()">
          <i class="fas fa-shield-alt"></i>
          {{ showAdminCode ? 'Admin Registration Active' : 'Register as Admin' }}
        </button>

        <div class="admin-code-section" *ngIf="showAdminCode">
          <div class="form-group">
            <label class="form-label" for="adminCode">Admin Code</label>
            <input 
              type="text" 
              id="adminCode"
              class="form-control" 
              formControlName="adminCode" 
              placeholder="Enter admin code">
            <div class="form-error" *ngIf="registerForm.get('adminCode')?.hasError('required') && registerForm.get('adminCode')?.touched">
              Admin code is required for admin registration
            </div>
          </div>
        </div>

        <button 
          type="submit" 
          class="btn-register" 
          [disabled]="registerForm.invalid"
          [class.loading]="isLoading">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        <p class="auth-text">Already have an account?</p>
        <button 
          type="button" 
          class="btn-login-link" 
          (click)="goToLogin()">
          <i class="fas fa-sign-in-alt"></i>
          Return to Login
        </button>
      </div>
    </div>
  </div>
</div>

<app-toast></app-toast>
