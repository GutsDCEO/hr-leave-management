<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Sign in to your account to continue</p>
    </div>
    
    <div class="auth-body">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input 
            type="email" 
            id="email"
            class="form-control" 
            formControlName="email" 
            placeholder="Enter your email"
            [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <div class="form-error" *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched">
            Email is required
          </div>
          <div class="form-error" *ngIf="loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched">
            Please enter a valid email address
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password"
            class="form-control" 
            formControlName="password" 
            placeholder="Enter your password"
            [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <div class="form-error" *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
            Password is required
          </div>
        </div>

        <button 
          type="submit" 
          class="btn-login" 
          [disabled]="loginForm.invalid"
          [class.loading]="isLoading">
          Sign In
        </button>
      </form>

      <button 
        type="button" 
        class="btn-register" 
        (click)="goToRegister()">
        <i class="fas fa-user-plus"></i>
        Create New Account
      </button>
    </div>
  </div>
</div>

<app-toast></app-toast>
