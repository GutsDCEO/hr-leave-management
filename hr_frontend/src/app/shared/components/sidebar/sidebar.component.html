<div id="viewport">
  <!-- Sidebar -->
  <div id="sidebar">
    <ul class="table">

      <li *ngIf="currentRole === 'ADMIN'">
        <a [routerLink]="['/admin/dashboard']" routerLinkActive="active">
          <i class="zmdi zmdi-view-dashboard"></i> Dashboard
        </a>
      </li>
      <li *ngIf="currentRole === 'EMPLOYEE'">
        <a href="#">
          <i class="zmdi zmdi-calendar-account"></i> My Leave
        </a>
      </li>
      <li *ngIf="currentRole === 'ADMIN'">
        <a [routerLink]="['/admin/leave-requests']" routerLinkActive="active">
          <i class="zmdi zmdi-widgets"></i> Leave Requests
        </a>
      </li>
      <li>
        <a href="#">
          <i class="zmdi zmdi-calendar"></i> Events
        </a>
      </li>
      <li>
        <a href="#">
          <i class="zmdi zmdi-info-outline"></i> About
        </a>

      <li>
        <a href="#">
          <i class="zmdi zmdi-comment-more"></i> Contact
        </a>
      </li>

</div>
